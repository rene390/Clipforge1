services:
  - type: web
    name: clipforge-ai-api
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://iridescent-zuccutto-70dd74.netlify.app
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE
        value: int8
